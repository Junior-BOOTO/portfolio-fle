<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Assemblée des jeunes citoyens — LUDOTHÈQUE FLE PRO</title><style>body{font:17px system-ui;max-width:900px;margin:auto;padding:24px;background:#eaf5f4;color:#17364d}header{background:#17364d;color:#fff;padding:25px;border-radius:18px}.card{border:1px solid #c4dcdb;border-radius:15px;padding:20px;background:white;margin:15px 0}button{font:inherit;cursor:pointer;padding:10px 15px;border:0;border-radius:8px;background:#117f88;color:white;margin:5px}label{display:block;margin:12px 0}textarea{width:95%;font:inherit;padding:9px}#out{white-space:pre-wrap}button:focus{outline:3px solid orange}</style><header><small>LUDOTHÈQUE FLE PRO · Projet 26 · Grade 5 · A2</small><h1>🏛️ L’Assemblée des jeunes citoyens</h1><p>Écouter, débattre, décider et agir ensemble.</p></header><section class="card"><h2 id="title"></h2><p id="question"></p><div id="answers"></div><button onclick="check()">Vérifier</button><button onclick="next()">Défi suivant →</button><p id="feedback" role="status"></p></section><h2>Écris ta résolution</h2><section class="card"><label>Problème <textarea id="p" rows="2"></textarea></label><label>Proposition <textarea id="a" rows="2"></textarea></label><label>Compromis <textarea id="c" rows="2"></textarea></label><label>Indicateur de réussite <textarea id="i" rows="2"></textarea></label><button onclick="make()">Préparer la résolution</button><p id="out" role="status"></p></section><p><b>Je peux…</b> proposer une idée, la justifier, écouter une objection et décider avec mon équipe.</p><small>Junior BOOTO WABA · Scénarios fictifs</small><script>let q=[['La cour est sale. Quelle mesure est utile ?',['Installer des bacs de tri','Jeter plus de papier','Ne rien faire'],0],['Deux élèves ne sont pas d’accord. Que faut-il faire ?',['Écouter les deux avis','Interrompre l’autre','Se moquer'],0],['Une proposition coûte trop cher. Comment agir ?',['Tester une version plus simple','Ignorer le budget','Annuler sans discuter'],0],['Quel argument est le plus clair ?',['Nous proposons un coin lecture parce que les élèves veulent lire.','Parce que oui.','Tout le monde sait.'],0],['Comment prendre une décision collective ?',['Organiser un vote après le débat','Décider seul','Ne pas écouter'],0],['Comment mesurer un progrès ?',['Compter les déchets chaque semaine','Dire que tout est mieux','Ne rien observer'],0]];let n=0;function render(){document.getElementById('title').textContent='Défi '+(n+1)+'/6';document.getElementById('question').textContent=q[n][0];document.getElementById('answers').innerHTML=q[n][1].map((s,i)=>'<label><input type="radio" name="answer" value="'+i+'"> '+s+'</label>').join('');document.getElementById('feedback').textContent=''}function check(){let a=document.querySelector('input[name=answer]:checked');document.getElementById('feedback').textContent=!a?'Choisis une proposition.':+a.value===q[n][2]?'Bravo ! Cette proposition est constructive.':'Essaie encore.'}function next(){n=(n+1)%q.length;render()}function make(){let f=id=>document.getElementById(id).value.trim();document.getElementById('out').textContent=['p','a','c','i'].every(f)?'PROBLÈME : '+f('p')+'\nPROPOSITION : '+f('a')+'\nCOMPROMIS : '+f('c')+'\nINDICATEUR : '+f('i'):'Complète les quatre champs.'}render()</script></html>
