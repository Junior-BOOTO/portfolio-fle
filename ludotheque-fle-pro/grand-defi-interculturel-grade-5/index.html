<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grand Défi interculturel — FLE PRO</title><style>body{font:17px system-ui;background:#eff8f8;color:#18354d;max-width:840px;margin:auto;padding:22px}header{background:#18354d;color:white;padding:24px;border-radius:20px}.card{border:1px solid #c1dedf;border-radius:13px;padding:19px;background:white;margin:16px 0}button{background:#087e8b;border:0;border-radius:8px;color:white;padding:11px 16px;font:inherit;cursor:pointer;margin:5px}button:focus{outline:3px solid orange}label{display:block;padding:8px}select{font:inherit;padding:8px}#feedback{font-weight:bold}</style><header><small>LUDOTHÈQUE FLE PRO · Grade 5 · A2 · Projet 21</small><h1>🌍 Le Grand Défi interculturel</h1><p>Compare les goûts des personnes, pas les clichés sur les pays !</p></header><div class="card"><h2 id="counter"></h2><p id="question"></p><div id="options"></div><button onclick="check()">Vérifier</button><button onclick="next()">Suivant →</button><p id="feedback" role="status"></p></div><h2>Construis ta comparaison</h2><div class="card"><label>Personnage A <select id="a"><option>Lina</option><option>Sami</option><option>Éva</option><option>Noé</option></select></label><label>Personnage B <select id="b"><option>Aya</option><option>Hugo</option><option>Maya</option><option>Adam</option></select></label><label>Préférence A <select id="x"><option>la lecture</option><option>la danse</option><option>le sport</option></select></label><label>Préférence B <select id="y"><option>la musique</option><option>le cinéma</option><option>la peinture</option></select></label><button onclick="make()">Créer une phrase</button><p id="sentence" role="status"></p></div><p><b>Je peux :</b> comparer, reformuler, justifier et respecter les choix d'autrui.</p><small>Conception : Junior BOOTO WABA · Personnages fictifs</small><script>let q=[['Quelle question est ouverte ?', ['Quel aliment préfères-tu ?','Tu aimes les pommes, oui ou non ?','Quel âge as-tu ?'],0],['Quelle phrase évite un stéréotype ?', ['Tous les habitants mangent pareil.','Les habitudes varient selon les personnes.','Un pays a une seule recette.'],1],['Quelle expression compare ?', ['tandis que','hier','à gauche'],0],['Que faire si une réponse est différente ?', ['Écouter avec respect','Se moquer','Ignorer'],0],['Comment justifier un choix ?', ['parce que','pendant','derrière'],0],['Que fait un médiateur ?', ['Il reformule les idées sans les déformer.','Il interdit la parole.','Il choisit pour les autres.'],0]];let n=0;function render(){document.getElementById('counter').textContent='Défi '+(n+1)+'/6';document.getElementById('question').textContent=q[n][0];document.getElementById('options').innerHTML=q[n][1].map((s,i)=>'<label><input type="radio" name="ans" value="'+i+'"> '+s+'</label>').join('');document.getElementById('feedback').textContent=''}function check(){let a=document.querySelector('input[name=ans]:checked');document.getElementById('feedback').textContent=!a?'Choisis une réponse.':+a.value===q[n][2]?'Bravo, bonne réponse !':'Essaie encore.'}function next(){n=(n+1)%q.length;render()}function make(){let v=id=>document.getElementById(id).value;document.getElementById('sentence').textContent=v('a')+' préfère '+v('x')+', tandis que '+v('b')+' préfère '+v('y')+'. Ces préférences sont individuelles.'}render()</script></html>
