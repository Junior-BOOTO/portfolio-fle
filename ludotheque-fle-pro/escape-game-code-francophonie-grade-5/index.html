<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le code de la francophonie — Projet 28</title><style>body{font:17px system-ui;background:#eaf5f5;color:#17354b;margin:auto;max-width:850px;padding:20px}header{background:#17354b;color:white;padding:25px;border-radius:18px}.card{background:white;padding:22px;border-radius:14px;margin:15px 0;border:1px solid #bddada}button{background:#087f8c;color:white;border:0;border-radius:9px;padding:12px;cursor:pointer}label{display:block;padding:9px}#digits{font-size:27px;letter-spacing:8px;font-weight:bold}</style><header><small>LUDOTHÈQUE FLE PRO · PROJET 28 · GRADE 5 · A2</small><h1>🔐 Le code de la francophonie</h1><p>Six énigmes pour ouvrir le coffre des voix.</p></header><section class="card"><h2 id="title"></h2><p id="question"></p><div id="answers"></div><button onclick="check()">Vérifier</button> <button onclick="next()">Suivant →</button><p id="feedback" role="status"></p></section><section class="card"><h2>Mon code</h2><p id="digits"></p><p id="complete" role="status"></p><button onclick="reset()">Recommencer</button></section><p>Conception : Junior BOOTO WABA. Scénarios fictifs.</p><script>const q=[['Emma parle français et espagnol. Idriss parle français et arabe. Combien de langues différentes ?',[2,3,4],3],['Lina aime le vélo. Sami préfère le bus. Combien de personnes expriment une préférence ?',[1,2,3],2],['« Le journal paraît vendredi » est un fait à vérifier. « Ce journal est magnifique » est une opinion. Combien d’opinions ?',[0,1,2],1],['Une annonce a un titre, une date et une source. Combien d’éléments ?',[1,2,3],3],['Écouter, protéger l’eau, trier le papier, se moquer : combien d’actions responsables ?',[2,3,4],3],['Réduire les déchets, économiser l’eau, planter des fleurs, gaspiller l’électricité : combien d’engagements écologiques ?',[2,3,4],3]];let i=0,found=Array(6).fill(null);function draw(){document.getElementById('title').textContent='Énigme '+(i+1)+'/6';document.getElementById('question').textContent=q[i][0];document.getElementById('answers').innerHTML=q[i][1].map(v=>'<label><input name="a" type="radio" value="'+v+'"> '+v+'</label>').join('');document.getElementById('feedback').textContent='';document.getElementById('digits').textContent=found.map(x=>x===null?'_':x).join(' ');document.getElementById('complete').textContent=found.every(x=>x!==null)?'Coffre ouvert ! Présente une action écocitoyenne.':''}function check(){let a=document.querySelector('input[name=a]:checked');if(!a){document.getElementById('feedback').textContent='Choisis une réponse.';return}if(+a.value===q[i][2]){found[i]=q[i][2];document.getElementById('feedback').textContent='Bravo !';drawCode()}else document.getElementById('feedback').textContent='Réessaie avec une preuve.'}function drawCode(){document.getElementById('digits').textContent=found.map(x=>x===null?'_':x).join(' ');if(found.every(x=>x!==null))document.getElementById('complete').textContent='Coffre ouvert ! Présente une action écocitoyenne.'}function next(){i=(i+1)%6;draw()}function reset(){i=0;found=Array(6).fill(null);draw()}draw()</script></html>
