<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission École — Ludothèque FLE PRO</title><style>body{margin:0;padding:22px;font:17px system-ui;background:#edf8f8;color:#183550}main{max-width:850px;margin:auto}header{background:#183550;color:white;border-radius:18px;padding:25px}.card{background:white;padding:20px;border-radius:14px;margin:15px 0;border:1px solid #c7dce0}button{border:0;border-radius:8px;background:#087f8c;color:white;font:inherit;padding:10px 15px;margin:5px;cursor:pointer}button:focus{outline:3px solid orange}label{display:block;margin:12px 0}select,textarea{font:inherit;padding:9px}#feedback{font-weight:bold}</style><main><header><small>LUDOTHÈQUE FLE PRO · PROJET 18 · GRADE 4 · A2</small><h1>🏫 Mission École</h1><p>Améliorons notre établissement !</p></header><div class="card"><h2 id="title"></h2><p id="problem"></p><div id="choices"></div><button onclick="verify()">Vérifier</button><button onclick="next()">Autre problème →</button><p id="feedback" role="status" aria-live="polite"></p></div><h2>Notre campagne</h2><div class="card"><label>Problème : <select id="pick"></select></label><label>Notre action : <textarea id="action" rows="2" placeholder="installer trois bacs de tri"></textarea></label><label>Pourquoi : <textarea id="reason" rows="2" placeholder="la cour sera plus propre"></textarea></label><button onclick="make()">Préparer mon affiche</button><p id="poster" role="status"></p></div><p><b>Je peux :</b> expliquer un problème, proposer une action et la justifier.</p><small>Conception : Junior BOOTO WABA · École fictive</small></main><script>const q=[['La cour est sale.',['Installer des bacs de tri','Jeter les papiers par terre','Supprimer les poubelles'],0],['Les robinets restent ouverts.',['Laisser couler l’eau','Afficher des rappels','Enlever les lavabos'],1],['On gaspille du papier.',['Réutiliser les feuilles','Tout imprimer deux fois','Jeter le papier propre'],0],['Le jardin est sec.',['Arroser les plantes','Couper toutes les plantes','Ne rien faire'],0],['On cherche souvent des objets perdus.',['Créer une boîte des objets trouvés','Cacher les objets','Interdire les sacs'],0],['Les affiches sont difficiles à lire.',['Écrire encore plus petit','Utiliser des titres clairs','Enlever tous les panneaux'],1]];let i=0;document.getElementById('pick').innerHTML=q.map(x=>'<option>'+x[0]+'</option>').join('');function draw(){document.getElementById('title').textContent='Défi '+(i+1)+' sur 6';document.getElementById('problem').textContent=q[i][0];document.getElementById('choices').innerHTML=q[i][1].map((a,j)=>'<label><input type="radio" name="answer" value="'+j+'"> '+a+'</label>').join('');document.getElementById('feedback').textContent=''}function verify(){let a=document.querySelector('input[name="answer"]:checked');document.getElementById('feedback').textContent=!a?'Choisis une réponse.':Number(a.value)===q[i][2]?'Bonne proposition !':'Essaie une solution plus responsable.'}function next(){i=(i+1)%q.length;draw()}function make(){let p=document.getElementById('pick').value,a=document.getElementById('action').value.trim(),r=document.getElementById('reason').value.trim();document.getElementById('poster').textContent=a&&r?'Problème : '+p+' Nous proposons de '+a+' parce que '+r+'.':'Ajoute une action et une justification.'}draw()</script></html>
