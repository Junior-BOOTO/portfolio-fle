<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passeport des saveurs — FLE PRO</title><style>body{font:17px system-ui;background:#edf7f7;color:#183850;max-width:920px;margin:auto;padding:22px}header{background:#183850;border-radius:18px;padding:25px;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.card{background:#fff;border:1px solid #c5dfe1;border-radius:13px;padding:16px;margin:10px 0}button{background:#087f8c;color:white;border:0;padding:11px 16px;border-radius:9px;cursor:pointer;font:inherit}button:focus{outline:3px solid orange}label{display:block;margin:12px 0}select,textarea{font:inherit;padding:8px}#feedback{font-weight:bold}</style><header><small>LUDOTHÈQUE FLE PRO · GRADE 5 · A2 · PROJET 20</small><h1>🍽️ Le Passeport des saveurs francophones</h1><p>Enquête, compare et respecte les différences.</p></header><h2>Les 12 cartes</h2><div class="grid" id="foods"></div><section class="card"><h2 id="n"></h2><p id="question"></p><div id="choices"></div><button onclick="check()">Vérifier</button> <button onclick="next()">Défi suivant →</button><p id="feedback" role="status"></p></section><h2>Crée ton passeport</h2><section class="card"><label>Personnage A <select id="a"><option>Amina</option><option>Louis</option><option>Sara</option></select></label><label>Personnage B <select id="b"><option>Hugo</option><option>Lina</option><option>Camille</option></select></label><label>Habitude de A <textarea id="ha" rows="2" placeholder="A aime le riz."></textarea></label><label>Habitude de B <textarea id="hb" rows="2" placeholder="B préfère le pain."></textarea></label><label>Point commun ou différence <textarea id="comp" rows="2" placeholder="Ils aiment tous les deux les fruits."></textarea></label><button onclick="make()">Créer le passeport</button><p id="out" role="status"></p></section><p><b>Je peux…</b> questionner, comparer et justifier sans généraliser.</p><small>Conception : Junior BOOTO WABA · Tous les profils sont fictifs.</small><script>const items=['Baguette','Riz','Mangue','Soupe','Fromage','Banane','Salade','Croissant','Haricots','Pain','Ananas','Carotte'];document.getElementById('foods').innerHTML=items.map((x,i)=>'<div class="card"><b>'+String(i+1).padStart(2,'0')+'</b><p>'+x+'</p></div>').join('');const q=[['Quelle question permet de découvrir une habitude ?', ['Où est la gare ?','Que manges-tu au petit déjeuner ?','Quel âge as-tu ?'],1],['Quelle phrase exprime une préférence ?', ['Je préfère la mangue.','Il pleut.','Je tourne à gauche.'],0],['Quelle phrase compare deux choix ?', ['A aime le riz tandis que B préfère le pain.','Il est mardi.','J’ai huit ans.'],0],['Quelle formulation respecte les différences ?', ['Tout le monde mange pareil dans ce pays.','Les habitudes peuvent varier selon les personnes.','Personne n’aime les légumes.'],1],['Pour expliquer un choix, je peux dire…', ['parce que','hier','à gauche'],0],['Que faut-il respecter lors d’un repas ?', ['Les allergies et les choix alimentaires','Uniquement mon choix','Les mêmes aliments pour tous'],0]];let k=0;function draw(){document.getElementById('n').textContent='Défi '+(k+1)+'/6';document.getElementById('question').textContent=q[k][0];document.getElementById('choices').innerHTML=q[k][1].map((x,i)=>'<label><input type="radio" name="answer" value="'+i+'"> '+x+'</label>').join('');document.getElementById('feedback').textContent=''}function check(){let v=document.querySelector('input[name=answer]:checked');document.getElementById('feedback').textContent=!v?'Choisis une réponse.':Number(v.value)===q[k][2]?'Bravo !':'Réessaie.'}function next(){k=(k+1)%q.length;draw()}function make(){let a=document.getElementById('a').value,b=document.getElementById('b').value,ha=document.getElementById('ha').value.trim(),hb=document.getElementById('hb').value.trim(),co=document.getElementById('comp').value.trim();document.getElementById('out').textContent=ha&&hb&&co?'Passeport : '+a+' : '+ha+' '+b+' : '+hb+' Comparaison : '+co:'Complète les trois textes.'}draw()</script></html>
