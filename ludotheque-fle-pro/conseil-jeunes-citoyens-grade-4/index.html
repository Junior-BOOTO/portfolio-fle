<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conseil des jeunes citoyens</title><style>body{font:17px system-ui;background:#eef8f8;color:#17334c;max-width:840px;margin:auto;padding:22px}header{background:#17334c;color:white;padding:24px;border-radius:20px}.card{padding:19px;background:white;border-radius:14px;margin:17px 0;border:1px solid #c2dbdc}button{background:#087f89;color:white;border:0;border-radius:9px;padding:10px 15px;margin:5px;cursor:pointer}button:focus{outline:3px solid orange}label{display:block;margin:12px 0}textarea{width:95%;font:inherit;padding:9px}#feedback{font-weight:bold}</style><header><small>LUDOTHÈQUE FLE PRO · PROJET 19 · GRADE 4 · A2</small><h1>🗳️ Le Conseil des jeunes citoyens</h1><p>Observe, propose, argumente et vote !</p></header><div class="card"><h2 id="title"></h2><p id="problem"></p><div id="choices"></div><button onclick="verify()">Vérifier</button><button onclick="next()">Défi suivant →</button><p id="feedback" role="status" aria-live="polite"></p></div><h2>Notre décision</h2><div class="card"><label>Notre proposition : <textarea id="idea" rows="2" placeholder="Installer des bacs de tri"></textarea></label><label>Notre justification : <textarea id="why" rows="2" placeholder="la cour sera plus propre"></textarea></label><label>Indicateur de réussite : <textarea id="indicator" rows="2" placeholder="compter les papiers dans la cour"></textarea></label><button onclick="prepare()">Générer notre compte rendu</button><p id="record" role="status"></p></div><p><b>Je peux :</b> proposer, justifier, écouter et participer à un vote.</p><small>Conception : Junior BOOTO WABA · Scénarios fictifs.</small><script>let cases=[['Il y a des déchets dans la cour.',['Installer des bacs de tri','Jeter des papiers','Ignorer le problème'],0],['Les robinets restent ouverts.',['Mettre des rappels','Laisser couler','Enlever les lavabos'],0],['Les élèves lisent peu.',['Créer un coin lecture','Cacher les livres','Fermer la bibliothèque'],0],['Des élèves restent seuls.',['Organiser des jeux inclusifs','Interdire les jeux','Les ignorer'],0],['On gaspille le papier.',['Réutiliser les feuilles','Imprimer deux fois','Jeter les feuilles propres'],0],['Les nouveaux élèves se perdent.',['Créer un plan illustré','Supprimer les panneaux','Fermer les couloirs'],0]];let n=0;function render(){document.getElementById('title').textContent='Défi '+(n+1)+'/6';document.getElementById('problem').textContent=cases[n][0];document.getElementById('choices').innerHTML=cases[n][1].map((x,i)=>'<label><input name="answer" type="radio" value="'+i+'"> '+x+'</label>').join('');document.getElementById('feedback').textContent=''}function verify(){let a=document.querySelector('input[name=answer]:checked');document.getElementById('feedback').textContent=!a?'Choisis une proposition.':Number(a.value)===cases[n][2]?'Une solution responsable !':'Réessaie.'}function next(){n=(n+1)%cases.length;render()}function prepare(){const a=document.getElementById('idea').value.trim(),b=document.getElementById('why').value.trim(),c=document.getElementById('indicator').value.trim();document.getElementById('record').textContent=a&&b&&c?'Nous proposons : '+a+'. Parce que '+b+'. Nous allons vérifier les progrès en '+c+'.':'Complète les trois champs.'}render()</script></html>
